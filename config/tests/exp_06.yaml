name: exp_06
description: CIBO-Canvas temporal repair calibration test run

run:
  seeds: [42]
  steps: 320
  record_interval: 1

canvas:
  height: 32
  width: 32

target:
  type: boundary
  top: 8
  left: 8
  height: 16
  width: 16
  thickness: 1

operator:
  count: 96
  radius: 1
  move: random_walk
  support: hybrid
  suppression: 0.5
  theta_preserve: 0.25
  repair_budget_ratio: 0.12
  l2_memory_steps: 3

trace:
  duration: 8
  decay: 0.875

perturbation:
  schedule:
    - type: random_noise
      time: 80
      strength: 0.03
      scope: all
    - type: local_gap_attack
      time: 140
      length: 8
      side: top

metrics:
  saturation_threshold: 0.9
  target_damage_threshold: 0.75
  recovery_threshold: 0.8

