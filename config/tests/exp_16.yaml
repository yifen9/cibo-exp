name: exp_16
description: CIBO-ED distributional evolution and matched random controls test run

parallel:
  workers: 16
  backend: process

run:
  train_seeds: [1, 2, 3]
  test_seeds: [11, 12, 13, 14, 15]
  train_offsets: [-2, 0, 2]
  test_offsets: [-3, -1, 1, 3]
  train_variants: [base, nearby]
  test_variants: [base, nearby]
  steps: 220
  record_interval: 1

canvas:
  height: 32
  width: 32

operator:
  count: 96
  radius: 1
  move: random_walk
  suppression: 0.5
  theta_preserve: 0.25

trace:
  duration: 8
  decay: 0.875

repair:
  mechanism: sliding
  theta_repair: 0.75
  k: 4
  m: 3
  w_local: 0.35
  w_bridge: 0.35
  w_marker: 0.25
  w_direction: 0.15
  w_cost: 0.25

evolution:
  population_size: 16
  generations: 20
  elite_count: 4
  mutation_rate: 0.10
  tournament_size: 3
  cvar_alpha: 0.25
  discovery_margin: 0.10
  random_chunk_size: 16

fitness_weights:
  connectivity: 2.0
  stability: 1.0
  cost: 0.5
  outside: 1.0
  false_corridor: 0.5
  complexity: 0.15

metrics:
  strong_connectivity_threshold: 0.90
  strong_cost_factor: 1.50
  strict_connectivity_threshold: 0.95
  strict_cost_factor: 1.25
  strict_outside_open_rate: 0.05
  robust_max_generalization_gap: 0.50

conditions:
  - id: A_T1_MEAN_R1
    group: A
    task: T1
    task_distribution: T1_Dist
    path_type: single_narrow
    perturbation_type: bridge_cut
    fitness_family: mean
    representation: R1
    damage_time: 100
    cut_length: 5
    noise_stress: false

  - id: B_T1_WORST_R1
    group: B
    task: T1
    task_distribution: T1_Dist
    path_type: single_narrow
    perturbation_type: bridge_cut
    fitness_family: worst
    representation: R1
    damage_time: 100
    cut_length: 5
    noise_stress: false

  - id: C_T1_CVAR_R1
    group: C
    task: T1
    task_distribution: T1_Dist
    path_type: single_narrow
    perturbation_type: bridge_cut
    fitness_family: cvar
    representation: R1
    damage_time: 100
    cut_length: 5
    noise_stress: false

  - id: D_T2_MEAN_R3
    group: D
    task: T2
    task_distribution: T2_Dist
    path_type: double_path
    perturbation_type: bridge_cut
    fitness_family: mean
    representation: R3
    damage_time: 100
    cut_length: 7
    noise_stress: false

  - id: E_T2_WORST_R3
    group: E
    task: T2
    task_distribution: T2_Dist
    path_type: double_path
    perturbation_type: bridge_cut
    fitness_family: worst
    representation: R3
    damage_time: 100
    cut_length: 7
    noise_stress: false

  - id: F_T2_CVAR_R3
    group: F
    task: T2
    task_distribution: T2_Dist
    path_type: double_path
    perturbation_type: bridge_cut
    fitness_family: cvar
    representation: R3
    damage_time: 100
    cut_length: 7
    noise_stress: false

  - id: G_T2_CVAR_R3_NOISE
    group: G
    task: T2
    task_distribution: T2_Dist_Noise
    path_type: double_path
    perturbation_type: bridge_cut
    fitness_family: cvar
    representation: R3
    damage_time: 100
    cut_length: 7
    noise_stress: true
    sigma: 0.10

output:
  root: data/tests/exp_16
  save_best_genome: true
  save_final_snapshot: false
  make_plot: true
